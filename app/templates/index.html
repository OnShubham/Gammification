<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Streak Tracker</title>
    <link rel="stylesheet" href="/static/style.css?v=3.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">

        <!-- User ID Input (shown when no user is set) -->
        <div id="user-id-card" class="card">
            <h1>Welcome to Streak Tracker</h1>
            <p class="subtitle">Enter your User ID to get started</p>
            <div class="user-input-container">
                <input type="text" id="user-id-input" placeholder="Enter your User ID (e.g., user123)" 
                    style="width: 100%; margin-bottom: 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px; border-radius: 12px; color: white;">
                <button class="btn" onclick="setUserId()">Start Tracking</button>
                <p style="margin-top: 20px; font-size: 14px; color: var(--text-secondary);">
                    Your User ID can be anything - it's just used to track your streaks!
                </p>
            </div>
        </div>

        <!-- Main App (Hidden by default) -->
        <div id="app-card" class="card" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1 style="margin: 0;">Daily Check-In</h1>
                <button onclick="changeUser()"
                    style="background: none; border: none; color: var(--text-secondary); cursor: pointer;">Change User</button>
            </div>

            <p class="subtitle">Keep the fire burning, <span id="display-user-id"
                    style="color: var(--accent-color); font-weight: 600;"></span>!</p>

            <div class="streak-container">
                <div class="fire-icon">🔥</div>
                <div class="streak-count" id="streak-count">0</div>
                <div class="streak-label">Day Streak</div>
            </div>

            <button class="btn" id="checkin-btn" onclick="checkIn()">Check In Now</button>

            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-value" id="longest-streak">0</div>
                    <div class="stat-label">Longest Streak</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="last-checkin">Never</div>
                    <div class="stat-label">Last Check-in</div>
                </div>
            </div>

            <!-- Achievements Section -->
            <div class="achievements-section">
                <div class="section-title">Milestone Achievements</div>

                <div class="milestones-grid" id="milestones-grid">
                    <!-- Milestone badges will be dynamically inserted here -->
                </div>

                <div class="total-achievements">
                    <div class="achievement-label">Total Milestones</div>
                    <div class="achievement-count" id="counting-streaks">0</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/script.js?v=3.0"></script>
</body>

</html>
