<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Streak</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">

        <!-- Login Form -->
        <div id="login-card" class="card">
            <h1>Welcome Back</h1>
            <p class="subtitle">Login to save your streak</p>
            <div class="user-input-container">
                <input type="text" id="login-username" placeholder="Username" style="width: 100%; margin-bottom: 10px;">
                <input type="password" id="login-password" placeholder="Password"
                    style="width: 100%; margin-bottom: 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px; border-radius: 12px; color: white;">
                <button class="btn" onclick="login()">Login</button>
                <p style="margin-top: 20px; font-size: 14px; color: var(--text-secondary);">
                    New here? <a href="#" onclick="showRegister()" style="color: var(--accent-color);">Register</a>
                </p>
            </div>
        </div>

        <!-- Register Form -->
        <div id="register-card" class="card" style="display: none;">
            <h1>Create Account</h1>
            <p class="subtitle">Start your journey today</p>
            <div class="user-input-container">
                <input type="text" id="reg-username" placeholder="Username" style="width: 100%; margin-bottom: 10px;">
                <input type="password" id="reg-password" placeholder="Password"
                    style="width: 100%; margin-bottom: 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px; border-radius: 12px; color: white;">
                <button class="btn" onclick="register()">Sign Up</button>
                <p style="margin-top: 20px; font-size: 14px; color: var(--text-secondary);">
                    Already have an account? <a href="#" onclick="showLogin()"
                        style="color: var(--accent-color);">Login</a>
                </p>
            </div>
        </div>

        <!-- Main App (Hidden by default) -->
        <div id="app-card" class="card" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h1 style="margin: 0;">Daily Check-In</h1>
                <button onclick="logout()"
                    style="background: none; border: none; color: var(--text-secondary); cursor: pointer;">Logout</button>
            </div>

            <p class="subtitle">Keep the fire burning, <span id="display-username"
                    style="color: var(--accent-color);"></span>!</p>

            <div class="streak-container">
                <div class="fire-icon">🔥</div>
                <div class="streak-count" id="streak-count">0</div>
                <div class="streak-label">Day Streak</div>
            </div>

            <button class="btn" id="checkin-btn" onclick="checkIn()">Check In Now</button>

            <div class="stats-row">
                <div class="stat-item">
                    <div class="stat-value" id="longest-streak">0</div>
                    <div class="stat-label">Longest Streak</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="last-checkin">Never</div>
                    <div class="stat-label">Last Check-in</div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>

</html>
